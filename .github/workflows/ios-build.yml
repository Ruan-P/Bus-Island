name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned app and IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show ContentView marker
        run: |
          set -euo pipefail
          git rev-parse --short HEAD
          grep -n "BI-GBIS v1.1 build 14" BusIsland/ContentView.swift
          test -f BusIsland/Services/DebugLogStore.swift
          test -f BusIsland/DebugConsoleView.swift
          if grep -nE '\?\.value\?\.' BusIsland -r --include='*.swift'; then
            echo "ERROR: invalid optional chaining on non-optional .value"
            exit 1
          fi
          if grep -n "selectStation(" BusIsland/NearbyStationsMapView.swift; then
            echo "ERROR: NearbyStationsMapView still calls selectStation"
            exit 1
          fi
          grep -n "selectNearbyStation" BusIsland/NearbyStationsMapView.swift
          grep -n "TAGO(1613000)" BusIsland/ContentView.swift
          test -f BusIsland/Services/Tago/TagoStationClient.swift
          test -f BusIsland/Services/Tago/TagoArrivalClient.swift
          test -f BusIsland/Services/Gbis/GbisAPIClient.swift

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -project BusIsland.xcodeproj -list

      - name: Build (no code signing)
        run: |
          set -euo pipefail
          set -o pipefail
          LOG=build/xcodebuild-build.log
          mkdir -p build
          set +e
          xcodebuild \
            -project BusIsland.xcodeproj \
            -scheme BusIsland \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "===== COMPILE ERRORS (filtered) ====="
            grep -E "error:|warning:.*error|fatal error" "$LOG" | head -80 || true
            echo "===== SWIFT ERROR LINES ====="
            ERRORS=$(grep -E "\.swift:[0-9]+:[0-9]+: error:" "$LOG" | head -30 || true)
            echo "$ERRORS"
            echo "===== TAIL ====="
            tail -n 80 "$LOG" || true
            # Publish errors as workflow annotations (visible via check-run annotations API)
            echo "$ERRORS" | while IFS= read -r line; do
              echo "::error::$line"
            done
            # Also publish to job summary so errors are visible without log download
            {
              echo "## ❌ xcodebuild failed (exit $STATUS)"
              echo ""
              echo '```'
              echo "$ERRORS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi

      - name: Archive (no code signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project BusIsland.xcodeproj \
            -scheme BusIsland \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/BusIsland.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Verify binary UI strings
        run: |
          set -euo pipefail
          APP="build/BusIsland.xcarchive/Products/Applications/BusIsland.app"
          BIN="$APP/BusIsland"
          ls -la "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" || true
          strings "$BIN" > build/app-strings.txt || true
          # Avoid `echo | grep -q` under pipefail: grep -q closes early and echo gets SIGPIPE.
          grep -F "BI-GBIS" build/app-strings.txt >/dev/null || {
            echo "ERROR: BI-GBIS marker missing in binary"
            grep -E "BI-GBIS|GBIS|build" build/app-strings.txt | head -40 || true
            exit 1
          }
          grep -F "build 14" build/app-strings.txt >/dev/null || {
            echo "ERROR: build marker missing in binary"
            grep -E "BI-GBIS|GBIS|build" build/app-strings.txt | head -40 || true
            exit 1
          }
          if grep -F "테스트 버스 라이드" build/app-strings.txt >/dev/null; then
            echo "ERROR: old mock UI still in binary"
            exit 1
          fi
          echo "Binary OK"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/BusIsland.xcarchive/Products/Applications/BusIsland.app"
          rm -rf build/Payload build/ipa
          mkdir -p build/Payload build/ipa
          cp -R "$APP_PATH" build/Payload/
          (
            cd build
            zip -qr "ipa/BusIsland-v1.1-build14-GBIS.ipa" Payload
          )
          cp build/ipa/BusIsland-v1.1-build14-GBIS.ipa build/BusIsland-unsigned.ipa
          ls -lh build/ipa/
          shasum -a 256 build/ipa/BusIsland-v1.1-build14-GBIS.ipa

      - name: Upload IPA artifact (versioned)
        uses: actions/upload-artifact@v4
        with:
          name: BusIsland-v1.1-build14-GBIS-ipa
          path: build/ipa/BusIsland-v1.1-build14-GBIS.ipa
          if-no-files-found: error

      - name: Upload IPA artifact (legacy name)
        uses: actions/upload-artifact@v4
        with:
          name: BusIsland-unsigned-ipa
          path: build/BusIsland-unsigned.ipa
          if-no-files-found: error

      - name: Upload xcarchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusIsland-xcarchive
          path: build/BusIsland.xcarchive
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild-build.log
          if-no-files-found: ignore
