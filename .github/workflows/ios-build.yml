name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned app and IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project BusIsland.xcodeproj \
            -scheme BusIsland \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project BusIsland.xcodeproj \
            -scheme BusIsland \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/BusIsland.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/BusIsland.xcarchive/Products/Applications/BusIsland.app"
          PAYLOAD="build/Payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          cp -R "$APP_PATH" "$PAYLOAD/"
          cd build
          zip -qr BusIsland-unsigned.ipa Payload
          cd ..
          ls -lh build/BusIsland-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusIsland-unsigned-ipa
          path: build/BusIsland-unsigned.ipa
          if-no-files-found: error

      - name: Upload xcarchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusIsland-xcarchive
          path: build/BusIsland.xcarchive
          if-no-files-found: error
