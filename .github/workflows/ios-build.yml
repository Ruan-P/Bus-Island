name: iOS Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned app and IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          set -euo pipefail
          git rev-parse --short HEAD
          test -f BusIsland/ContentView.swift
          test -f BusIsland/StopPickerView.swift
          test -f BusIsland/NearbyStationsMapView.swift
          test -f BusIsland/SettingsView.swift
          test -f BusIsland/DebugConsoleView.swift
          test -f BusIsland/Services/DebugLogStore.swift
          test -f BusIsland/Services/Tago/TagoStationClient.swift
          test -f BusIsland/Services/Tago/TagoArrivalClient.swift
          test -f BusIsland/Services/Gbis/GbisAPIClient.swift
          test -f BusIslandWidget/BusRideLiveActivity.swift
          
          if grep -nE '\?\.value\?\.' BusIsland -r --include='*.swift'; then
            echo "ERROR: invalid optional chaining on non-optional .value"
            exit 1
          fi
          
          grep -n "승차" BusIsland/ContentView.swift
          grep -n "하차" BusIsland/ContentView.swift

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -project BusIsland.xcodeproj -list

      - name: Build (no code signing)
        run: |
          set -euo pipefail
          set -o pipefail
          LOG=build/xcodebuild-build.log
          mkdir -p build
          set +e
          xcodebuild \
            -project BusIsland.xcodeproj \
            -scheme BusIsland \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "===== COMPILE ERRORS (filtered) ====="
            grep -E "error:|warning:.*error|fatal error" "$LOG" | head -80 || true
            echo "===== SWIFT ERROR LINES ====="
            ERRORS=$(grep -E "\.swift:[0-9]+:[0-9]+: error:" "$LOG" | head -30 || true)
            echo "$ERRORS"
            echo "===== TAIL ====="
            tail -n 80 "$LOG" || true
            # Publish errors as workflow annotations (visible via check-run annotations API)
            echo "$ERRORS" | while IFS= read -r line; do
              echo "::error::$line"
            done
            # Also publish to job summary so errors are visible without log download
            {
              echo "## ❌ xcodebuild failed (exit $STATUS)"
              echo ""
              echo '```'
              echo "$ERRORS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi

      - name: Archive (no code signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project BusIsland.xcodeproj \
            -scheme BusIsland \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/BusIsland.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Verify binary
        run: |
          set -euo pipefail
          APP="build/BusIsland.xcarchive/Products/Applications/BusIsland.app"
          BIN="$APP/BusIsland"
          ls -la "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" || true
          strings "$BIN" > build/app-strings.txt || true
          grep -F "BusIsland" build/app-strings.txt >/dev/null || {
            echo "ERROR: BusIsland marker missing in binary"
            exit 1
          }
          echo "Binary OK"

      - name: Verify app icon packaging (Asset Catalog)
        run: |
          set -euo pipefail
          APP="build/BusIsland.xcarchive/Products/Applications/BusIsland.app"

          # 1. Asset Catalog compiled binary must exist
          test -f "$APP/Assets.car" || {
            echo "ERROR: $APP/Assets.car missing"
            exit 1
          }
          echo "Assets.car exists"

          # 2. Final Info.plist must carry the Asset Catalog source of truth
          ICON_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Info.plist")
          test "$ICON_NAME" = "AppIcon" || {
            echo "ERROR: CFBundleIconName=$ICON_NAME (expected AppIcon)"
            exit 1
          }
          echo "CFBundleIconName=$ICON_NAME"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon' "$APP/Info.plist" >/dev/null 2>&1 || {
            echo "ERROR: CFBundleIcons/CFBundlePrimaryIcon missing in final Info.plist"
            exit 1
          }
          PRIMARY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist")
          test "$PRIMARY_NAME" = "AppIcon" || {
            echo "ERROR: CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName=$PRIMARY_NAME (expected AppIcon)"
            exit 1
          }
          echo "CFBundleIcons/CFBundlePrimaryIcon OK"

          # 3. Xcode may emit a required iPhone icon PNG beside Assets.car.
          # Reject only the old CI workaround's broad source-copy artifacts;
          # allow the actool-generated AppIcon60x60@2x.png output.
          for forbidden in AppIcon.png AppIcon-1024.png AppIcon20x20@2x.png AppIcon20x20@3x.png AppIcon29x29@2x.png AppIcon29x29@3x.png AppIcon40x40@2x.png AppIcon40x40@3x.png AppIcon60x60@3x.png; do
            if [ -e "$APP/$forbidden" ]; then
              echo "ERROR: unexpected loose source icon in .app root: $forbidden"
              exit 1
            fi
          done
          if [ -e "$APP/AppIcon60x60@2x.png" ]; then
            echo "Allowed actool-generated AppIcon60x60@2x.png present"
          else
            echo "No standalone iPhone icon emitted by actool"
          fi

          # 4. Bundle identity
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test "$BUNDLE_ID" = "com.busisland.BusIsland" || {
            echo "ERROR: CFBundleIdentifier=$BUNDLE_ID (expected com.busisland.BusIsland)"
            exit 1
          }
          echo "CFBundleIdentifier=$BUNDLE_ID"
          test -x "$APP/BusIsland" || {
            echo "ERROR: $APP/BusIsland executable missing"
            exit 1
          }
          echo "Executable OK"

          # 5. Inspect Assets.car AppIcon slots when assetutil is available
          if command -v assetutil >/dev/null 2>&1; then
            SLOT_COUNT=$(assetutil --info "$APP/Assets.car" | grep -ci 'AppIcon' || true)
            test "$SLOT_COUNT" -ge 1 || {
              echo "ERROR: no AppIcon slots found in Assets.car"
              exit 1
            }
            echo "Assets.car has $SLOT_COUNT AppIcon slot entries"
            assetutil --info "$APP/Assets.car" | grep -iE 'AppIcon|PixelWidth|PixelHeight' | head -40
          else
            echo "assetutil not available; skipping Assets.car slot inspection"
          fi
          echo "App icon packaging OK"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/BusIsland.xcarchive/Products/Applications/BusIsland.app"
          rm -rf build/Payload build/ipa
          mkdir -p build/Payload build/ipa
          cp -R "$APP_PATH" build/Payload/

          # Xcode may emit the required iPhone icon beside Assets.car.
          # Reject only broad source-copy artifacts; allow actool output.
          for forbidden in AppIcon.png AppIcon-1024.png AppIcon20x20@2x.png AppIcon20x20@3x.png AppIcon29x29@2x.png AppIcon29x29@3x.png AppIcon40x40@2x.png AppIcon40x40@3x.png AppIcon60x60@3x.png; do
            if [ -e "build/Payload/BusIsland.app/$forbidden" ]; then
              echo "ERROR: loose source icon would be shipped: $forbidden"
              exit 1
            fi
          done
          if [ -e build/Payload/BusIsland.app/AppIcon60x60@2x.png ]; then
            echo "Allowed actool-generated AppIcon60x60@2x.png present"
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Payload/BusIsland.app/Info.plist
          test -x build/Payload/BusIsland.app/BusIsland || {
            echo "ERROR: Payload/BusIsland.app/BusIsland executable missing"
            exit 1
          }
          echo "Payload/BusIsland.app structure OK"
          (
            cd build
            zip -qr "ipa/BusIsland-unsigned.ipa" Payload
          )
          ls -lh build/ipa/
          shasum -a 256 build/ipa/BusIsland-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusIsland-unsigned-ipa
          path: build/ipa/BusIsland-unsigned.ipa
          if-no-files-found: error

      - name: Upload xcarchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusIsland-xcarchive
          path: build/BusIsland.xcarchive
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild-build.log
          if-no-files-found: ignore
